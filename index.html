<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛒Jahid shop BD🛍️— Admin Panel</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#08090d;color:#fff}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:root{
  --bg:#08090d;--card:#101218;--card2:#0c0e13;--border:#252a34;
  --muted:#7f8796;--text:#fff;--green:#16a34a;--red:#dc3545;
  --blue:#3b82f6;--amber:#f59e0b
}

/* LOGIN */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#1b2030,#08090d 55%)}
.login-box{width:min(400px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 25px 80px #0009}
.brand{text-align:center;font-size:25px;font-weight:900;letter-spacing:2px}
.brand .z{color:#e63946}
.brand .m{color:#3b82f6}
.login-sub{text-align:center;color:var(--muted);font-size:11px;margin:7px 0 24px;letter-spacing:1px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;background:#090b10;border:1px solid var(--border);border-radius:9px;color:#fff;outline:none;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
.field textarea{min-height:85px;resize:vertical}
.password{position:relative}
.password input{padding-right:45px}
.eye{position:absolute;right:5px;top:4px;width:36px;height:36px;background:transparent;color:#8c94a3;border:0}
.login-error{min-height:18px;color:#ff858f;font-size:11px;margin:5px 0}
.login-btn{width:100%;height:44px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:800;font-size:13px}
.login-btn:disabled{opacity:.55;cursor:not-allowed}

/* TOPBAR */
.topbar{height:62px;position:sticky;top:0;z-index:90;background:#0d0f14ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px}
.hamburger{width:40px;height:40px;border:1px solid var(--border);border-radius:9px;background:#171a22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.hamburger span{width:19px;height:2px;background:#fff;border-radius:2px}
.top-title{flex:1;min-width:0}
.top-brand{font-size:16px;font-weight:900;letter-spacing:1.5px}
.top-brand .z{color:#e63946}
.top-brand .m{color:#3b82f6}
.top-section{font-size:10px;color:var(--muted);margin-top:3px}
.top-right{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.online{width:7px;height:7px;border-radius:50%;background:#4ade80}

/* BUTTONS */
.btn{height:36px;padding:0 13px;border:1px solid var(--border);border-radius:8px;background:#171a22;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:#596274}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red{background:#39171c;border-color:#61242b;color:#ff9ba3}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.amber{background:#3b2c0e;border-color:#f59e0b;color:#f7c75b}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* LAYOUT */
.layout{min-height:calc(100vh - 62px)}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;background:#0b0d12;border-right:1px solid var(--border);z-index:100;transform:translateX(-100%);transition:.25s;overflow:auto}
.sidebar.open{transform:translateX(0)}
.sidebar-head{height:62px;padding:0 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0b0d12;z-index:2}
.sidebar-brand{font-size:18px;font-weight:900;letter-spacing:1.5px}
.sidebar-brand .z{color:#e63946}
.sidebar-brand .m{color:#3b82f6}
.side-close{width:34px;height:34px;border:0;border-radius:8px;background:#171a22;color:#fff;font-size:19px}
.overlay{position:fixed;inset:0;background:#0008;z-index:99;display:none}
.overlay.show{display:block}
.nav{padding:12px 8px}
.nav-title{padding:8px 12px;color:#596171;font-size:9px;text-transform:uppercase;letter-spacing:1px}
.nav button{width:100%;border:0;background:transparent;color:#aab1bf;text-align:left;padding:11px 12px;border-radius:8px;font-size:12px;font-weight:650;margin:1px 0}
.nav button:hover,.nav button.active{background:#171a22;color:#fff}
.nav button.active{box-shadow:inset 3px 0 #3b82f6}
.nav-divider{height:1px;background:var(--border);margin:10px 8px}

/* MAIN */
.main{max-width:1250px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:15px}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat-value{font-size:23px;font-weight:900;margin-top:8px}
.stat-note{font-size:10px;color:#5d6675;margin-top:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px;margin-bottom:13px}
.card-title{font-size:14px;font-weight:800;margin:0 0 13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.list{display:grid;gap:9px}
.item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px}
.item-head{display:flex;justify-content:space-between;gap:10px}
.item-title{font-size:12px;font-weight:800}
.muted{color:var(--muted);font-size:10px;margin-top:4px}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:9px;font-weight:700;background:#20242d;color:#c7ccd5}
.pill.green{background:#10341f;color:#6ee7a4}
.pill.red{background:#37161b;color:#ff9ba3}
.pill.blue{background:#102c4a;color:#70aefc}
.pill.amber{background:#3b2c0e;color:#f7c75b}
.product{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px}
.product img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#181b22}
.product-name{font-size:12px;font-weight:800}
.product-meta{font-size:10px;color:var(--muted);margin-top:4px}
.product-actions{display:flex;gap:5px;flex-wrap:wrap}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:700px}
.table th,.table td{padding:10px;border-bottom:1px solid #1e222b;text-align:left;font-size:10px}
.table th{color:#737c8d;background:#0d0f14}
.table tr:last-child td{border:0}
.empty{text-align:center;color:#5f6877;padding:28px;font-size:11px}
.user{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e63946,#1d3557);font-weight:900}
.search{max-width:260px}
.method{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #20242c;flex-wrap:wrap}
.method:last-child{border:0}
.method-icon{width:38px;height:38px;border:1px solid var(--border);border-radius:9px;display:grid;place-items:center;color:#70aefc;font-size:16px}
.method-info{flex:1;min-width:150px}
.method-name{font-size:12px;font-weight:800}
.toggle{width:40px;height:22px;position:relative}
.toggle input{display:none}
.toggle span{position:absolute;inset:0;background:#303541;border-radius:20px}
.toggle span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span:before{transform:translateX(18px)}

/* SIZE/COLOR CHIP */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;background:#20242d;border:1px solid var(--border);font-size:11px;font-weight:700;margin:3px 3px 0 0}
.chip.sm{font-size:10px;padding:3px 9px}
.chip.size{background:#102c4a;color:#70aefc;border-color:#1e4b7a}
.chip.color{background:#3b2c0e;color:#f7c75b;border-color:#6b4d16}
.chip.user{background:#3b2c0e;color:#f7c75b;border-color:#6b4d16}
.chip.admin{background:#37161b;color:#ff9ba3;border-color:#61242b}

/* ORDER ITEM WITH IMAGE */
.order-item-row{display:flex;gap:12px;align-items:flex-start;padding:12px;background:#0c0e13;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.order-item-row img{width:56px;height:56px;border-radius:9px;object-fit:cover;background:#181b22;flex:none}
.order-item-row .info{flex:1;min-width:0}
.order-item-row .price{font-weight:800;white-space:nowrap}

/* PRODUCT SIZE/COLOR PANEL */
.psc-panel{background:#0c0e13;border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}
.psc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.psc-title{font-size:13px;font-weight:800}
.psc-hint{font-size:10px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.psc-list{display:flex;flex-direction:column;gap:7px}
.psc-item{background:#101218;border:1px solid var(--border);border-radius:9px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.psc-item-left{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.psc-empty{text-align:center;color:#5f6877;font-size:11px;padding:14px;border:1px dashed #232833;border-radius:9px}

/* IMAGE UPLOADER */
.uploader-area{border:2px dashed #303541;border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:.15s;background:#0a0c11}
.uploader-area:hover{border-color:var(--blue);background:#0d1018}
.uploader-area.dragover{border-color:var(--green);background:#0d1f17}
.uploader-icon{font-size:38px;margin-bottom:8px;opacity:.6}
.uploader-text{font-size:12px;color:var(--muted);line-height:1.6}
.uploader-text strong{color:#fff}
.uploader-preview{margin-top:14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.uploader-preview img{max-width:180px;max-height:180px;border-radius:10px;border:1px solid var(--border);background:#0a0c11}
.uploader-info{flex:1;min-width:200px;font-size:11px;color:#9ca3af;line-height:1.7}
.uploader-info .fname{color:#fff;font-weight:700;word-break:break-all}
.link-box{margin-top:14px;background:#0a0c11;border:1px solid var(--border);border-radius:10px;padding:12px}
.link-box label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.link-box .link-row{display:flex;gap:6px}
.link-box input{flex:1;background:#090b10;border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#6ee7a4;font-size:11px;font-family:monospace;outline:none}
.link-box input:focus{border-color:var(--blue)}
.progress-bar{height:6px;background:#1a1e28;border-radius:20px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0%;transition:.2s}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:1000;background:#000b;display:grid;place-items:center;padding:15px}
.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#11141b;border:1px solid #303541;border-radius:13px}
.modal-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-head strong{font-size:14px}
.modal-close{margin-left:auto;background:transparent;border:0;color:#aaa;font-size:21px}
.modal-body{padding:15px}

/* NOTIFICATION PREVIEW */
.notif-preview{background:#0c0e13;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:12px;color:#c7ccd5;line-height:1.6}
.notif-preview .by-admin{color:#ff9ba3;font-weight:700}
.notif-preview .by-user{color:#f7c75b;font-weight:700}

/* TOAST */
.toast{position:fixed;z-index:2000;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#fff;color:#111;padding:10px 16px;border-radius:9px;font-size:11px;font-weight:800;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){
  .main{padding:11px}
  .stats,.grid,.grid3{grid-template-columns:1fr}
  .top-right .online,.top-right span{display:none}
  .top-right .btn{display:inline-flex}
  .product{grid-template-columns:45px 1fr}
  .product img{width:45px;height:45px}
  .product-actions{grid-column:2}
  .search{max-width:100%;width:100%}
}
</style>
</head>
<body>

<!-- LOGIN VIEW -->
<div id="loginView" class="login">
  <div class="login-box">
    <div class="brand"><span class="z">🛒Jahid</span> <span class="m">Shop BD🛍️</span></div>
    <div class="login-sub">SECURE ADMINISTRATOR LOGIN</div>
    <form id="loginForm">
      <div class="field">
        <label>Admin Email</label>
        <input id="loginEmail" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password">
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button type="button" class="eye" onclick="togglePass()">◉</button>
        </div>
      </div>
      <div id="loginError" class="login-error"></div>
      <button id="loginBtn" class="login-btn" type="submit">Sign In</button>
    </form>
  </div>
</div>

<!-- ADMIN VIEW -->
<div id="adminView" class="hidden">
  <header class="topbar">
    <button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
    <div class="top-title">
      <div class="top-brand">
        <span class="z">🛒Jahid</span> <span class="m">Shop BD🛍️</span>
        <span style="font-size:9px;color:#727a89;border:1px solid #2b303b;padding:3px 5px;border-radius:4px">ADMIN</span>
      </div>
      <div id="sectionName" class="top-section">Dashboard</div>
    </div>
    <div class="top-right">
      <i class="online"></i><span>Administrator</span>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-brand"><span class="z">🛒Jahid</span> <span class="m">Shop BD🛍️</span></div>
      <button class="side-close" onclick="closeSidebar()">×</button>
    </div>
    <nav class="nav">
      <div class="nav-title">Management</div>
      <button data-page="dashboard" class="active" onclick="page('dashboard')">Dashboard</button>
      <button data-page="users" onclick="page('users')">Users</button>
      <button data-page="products" onclick="page('products')">Products</button>
      <button data-page="orders" onclick="page('orders')">Orders</button>
      <button data-page="payments" onclick="page('payments')">Payment Method</button>
      <button data-page="sliders" onclick="page('sliders')">Sliders</button>
      <button data-page="imageLink" onclick="page('imageLink')">Image to Link</button>
      <button data-page="settings" onclick="page('settings')">Settings</button>
      <button data-page="support" onclick="page('support')">Support Setting</button>
      <div class="nav-divider"></div>
      <button onclick="viewStore()">View Store</button>
      <button onclick="logout()" style="color:#ff929b">Logout</button>
    </nav>
  </aside>

  <main id="main" class="main"></main>
</div>

<div id="modalBg" class="modal-bg hidden" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>
<div id="toast" class="toast"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
/* ============================================================
   FIREBASE INIT
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBsZRSXC2TSyiVuMq333JYniQktC50doRQ",
  authDomain: "e-comars-ec5b2.firebaseapp.com",
  databaseURL: "https://e-comars-ec5b2-default-rtdb.firebaseio.com",
  projectId: "e-comars-ec5b2",
  storageBucket: "e-comars-ec5b2.firebasestorage.app",
  messagingSenderId: "969916007842",
  appId: "1:969916007842:web:90775ca7718a1d5441defb",
  measurementId: "G-8D17W0EPMC"
};
const ADMIN_UID = "EM3mwuD72UVTRJAHJHQHZiwNy6h1";
const IMGBB_API_KEY = "816eca5c8fdac2a9922b6384af9df61b";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* ============================================================
   STATE
============================================================ */
let currentPage = "dashboard";
let refs = [];
let data = {
  products: [], orders: [], users: [],
  payments: [], sliders: [],
  settings: {}, support: {}
};

// Current product's sizes/colors (in-memory while editing)
let pSizes  = [];
let pColors = [];

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, x => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
const arr = v => Object.entries(v || {}).map(([id, x]) => ({ id, ...x }));
const money = v => `${data.settings.currency || "৳"} ${Number(v || 0).toLocaleString()}`;
const date = v => v ? new Date(v).toLocaleString() : "—";

/* ============================================================
   HELPERS
============================================================ */
function toast(t){
  $("toast").textContent = t;
  $("toast").classList.add("show");
  clearTimeout(window.tt);
  window.tt = setTimeout(() => $("toast").classList.remove("show"), 2400);
}
function togglePass(){
  let x = $("loginPassword");
  x.type = x.type === "password" ? "text" : "password";
}
function toggleSidebar(){
  $("sidebar").classList.toggle("open");
  $("overlay").classList.toggle("show");
}
function closeSidebar(){
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
}
function closeModal(){ $("modalBg").classList.add("hidden"); }
function openModal(title, body){
  $("modal").innerHTML = `
    <div class="modal-head">
      <strong>${title}</strong>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">${body}</div>`;
  $("modalBg").classList.remove("hidden");
}
function copyToClipboard(text){
  if(!text){ toast("Nothing to copy"); return; }
  navigator.clipboard.writeText(text).then(() => {
    toast("✓ Link copied to clipboard");
  }).catch(() => {
    let ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("✓ Link copied"); } catch(e){ toast("Copy failed"); }
    document.body.removeChild(ta);
  });
}

/* ============================================================
   LOGIN
============================================================ */
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  let email = $("loginEmail").value.trim();
  let pass = $("loginPassword").value;
  let btn = $("loginBtn");
  let err = $("loginError");
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Signing in...";
  try {
    let result = await auth.signInWithEmailAndPassword(email, pass);
    if(result.user.uid !== ADMIN_UID){
      await auth.signOut();
      throw new Error("This Firebase account is not authorized as administrator.");
    }
  } catch (e){
    let c = e.code || "";
    err.textContent =
      c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found"
        ? "Invalid email or password."
        : c === "auth/invalid-email"
        ? "Invalid email address."
        : c === "auth/too-many-requests"
        ? "Too many login attempts. Try again later."
        : e.message || "Login failed.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
});

auth.onAuthStateChanged(user => {
  if(user && user.uid === ADMIN_UID){
    $("loginView").classList.add("hidden");
    $("adminView").classList.remove("hidden");
    startRealtime();
    page(currentPage);
  } else {
    $("adminView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    stopRealtime();
  }
});

/* ============================================================
   REALTIME SYNC
============================================================ */
function startRealtime(){
  stopRealtime();
  ["products","orders","users","payments","sliders"].forEach(key => {
    let r = db.ref(key);
    let f = s => {
      data[key] = arr(s.val());
      if(currentPage === "dashboard") renderDashboard();
      else if(currentPage === key) window["render_" + key]();
    };
    r.on("value", f);
    refs.push([r, f]);
  });
  ["settings","support"].forEach(key => {
    let r = db.ref(key);
    let f = s => {
      data[key] = s.val() || {};
      if(currentPage === "dashboard") renderDashboard();
      else if(currentPage === key) window["render_" + key]();
    };
    r.on("value", f);
    refs.push([r, f]);
  });
}
function stopRealtime(){

let recentUploads = [];

function setupUploader(){
  let area = $("uploaderArea");
  let input = $("uploaderInput");

  area.addEventListener("click", () => input.click());
  input.addEventListener("change", (e) => {
    if(e.target.files && e.target.files[0]) handleFileUpload(e.target.files[0]);
  });

  area.addEventListener("dragover", (e) => {
    e.preventDefault();
    area.classList.add("dragover");
  });
  area.addEventListener("dragleave", () => area.classList.remove("dragover"));
  area.addEventListener("drop", (e) => {
    e.preventDefault();
    area.classList.remove("dragover");
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFileUpload(e.dataTransfer.files[0]);
  });
}

function openUploaderPicker(){ $("uploaderInput").click(); }
function clearUploader(){
  $("uploaderResult").innerHTML = "";
  $("uploaderInput").value = "";
}

async function handleFileUpload(file){
  if(!file) return;
  if(!file.type.startsWith("image/")){ toast("Please select an image file"); return; }
  if(file.size > 32 * 1024 * 1024){ toast("File too large (max 32 MB)"); return; }
  if(!IMGBB_API_KEY || IMGBB_API_KEY === "YOUR_IMGBB_API_KEY_HERE"){ toast("ImgBB API key missing"); return; }

  let reader = new FileReader();
  reader.onload = (e) => {
    $("uploaderResult").innerHTML = `
      <div class="uploader-preview">
        <img src="${e.target.result}" alt="preview">
        <div class="uploader-info">
          <div class="fname">${esc(file.name)}</div>
          <div>Size: ${(file.size / 1024).toFixed(1)} KB</div>
          <div>Type: ${esc(file.type)}</div>
          <div style="margin-top:8px" id="uploadStatus">⏳ Uploading to ImgBB...</div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>`;
  };
  reader.readAsDataURL(file);

  try {
    let formData = new FormData();
    formData.append("image", file);

    let prog = 0;
    let timer = setInterval(() => {
      prog = Math.min(90, prog + 10);
      let el = $("progressFill");
      if(el) el.style.width = prog + "%";
    }, 150);

    let res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
      method: "POST",
      body: formData
    });
    clearInterval(timer);

    if(!res.ok) throw new Error("Upload failed (HTTP " + res.status + ")");
    let json = await res.json();
    if(!json.success || !json.data || !json.data.url){
      throw new Error((json.error && json.error.message) || "Upload failed");
    }

    let url = json.data.url;
    let displayUrl = json.data.display_url || url;

    let pf = $("progressFill");
    if(pf) pf.style.width = "100%";

    recentUploads.unshift({ url, displayUrl, name: file.name, time: Date.now() });

    $("uploaderResult").innerHTML = `
      <div class="uploader-preview">
        <img src="${esc(displayUrl)}" alt="uploaded">
        <div class="uploader-info">
          <div class="fname">✓ Upload Successful</div>
          <div>${esc(file.name)}</div>
          <div>Size: ${(file.size / 1024).toFixed(1)} KB</div>
        </div>
      </div>
      <div class="link-box">
        <label>Direct Image URL</label>
        <div class="link-row">
          <input type="text" id="resultUrl" value="${esc(url)}" readonly onclick="this.select()">
          <button class="btn green" onclick="copyToClipboard('${esc(url)}')">📋 Copy</button>
        </div>
        <div class="actions" style="margin-top:8px">
          <button class="btn" onclick="window.open('${esc(url)}','_blank')">🔗 Open</button>
          <button class="btn amber" onclick="sendToProductField('${esc(url)}')">➡ Send to Product Image 1</button>
          <button class="btn" onclick="clearUploader()">Clear</button>
        </div>
      </div>`;

    toast("✓ Image uploaded — link ready");
    renderRecentUploads();
  } catch(err){
    $("uploaderResult").innerHTML = `
      <div style="margin-top:14px;padding:14px;background:#37161b;border:1px solid #61242b;border-radius:10px;color:#ff9ba3;font-size:12px">
        ❌ <strong>Upload failed:</strong> ${esc(err.message)}<br>
        <div style="margin-top:8px;font-size:11px;opacity:.8">Check your ImgBB API key and internet connection.</div>
      </div>`;
    toast("Upload failed");
  }
}

function renderRecentUploads(){
  let box = $("recentUploads");
  if(!box) return;
  if(!recentUploads.length){
    box.innerHTML = `<div class="empty">No uploads yet.</div>`;
    return;
  }
  box.innerHTML = recentUploads.slice(0, 12).map((u, i) => `

  pSizes = [];
  pColors = [];

async function updateOrder(id){
  try {
    let o = data.orders.find(x => x.id === id);
    if(!o){ toast("Order not found"); return; }

    let newStatus = $("orderStatus").value;
    let oldStatus = o.status;

    let update = {
      status: newStatus,
      notification: $("orderNote").value.trim(),
      updatedAt: Date.now()
    };
    if($("paymentStatus") && $("paymentStatus").value){
      update.paymentStatus = $("paymentStatus").value;
    }

    // Admin cancelled the order
    if(newStatus === "Cancelled" && oldStatus !== "Cancelled"){
      update.cancelledAt = Date.now();
      update.cancelledBy = "admin";
      update.cancelledByName = "Admin";
      update.notification = "This order has been cancelled by Admin.";

      let walletUsed = Number(o.walletUsed || o.balanceUsed || 0);
      let refundAmount = 0;
      if(walletUsed > 0) refundAmount += walletUsed;
      if(o.paymentStatus === "verified" && o.paymentMethod !== "Cash on Delivery"){
        refundAmount += Number(o.paymentAmount || 0);
      }
      if(refundAmount > 0){
        update.refundStatus = "pending";
        update.refundAmount = refundAmount;
        update.notification = "Order cancelled by Admin. Refund of " + money(refundAmount) + " is pending.";
      }
    }

    await db.ref("orders/" + id).update(update);
    closeModal();
    toast("Order updated");
  } catch(e){ toast(e.message); }
}

async function deleteOrder(id){
  if(!confirm("Delete this order permanently?")) return;
  try {
    await db.ref("orders/" + id).remove();
    closeModal();
    toast("Order deleted");
  } catch(e){ toast(e.message); }
}

async function processRefund(orderId, userId, amount){
  if(!userId || userId === "guest"){ toast("Cannot refund — guest user"); return; }
  if(!amount || amount <= 0){ toast("Invalid refund amount"); return; }
  if(!confirm("Add " + money(amount) + " to user's wallet balance?")) return;

  try {
    let snap = await db.ref("users/" + userId).once("value");
    let user = snap.val();
    if(!user){ toast("User not found"); return; }
    let currentBalance = Number(user.balance || 0);
    let newBalance = currentBalance + Number(amount);
    await db.ref("users/" + userId).update({ balance: newBalance, updatedAt: Date.now() });
    await db.ref("orders/" + orderId).update({
      refundStatus: "refunded",
      refundedAt: Date.now(),
      notification: "Refund of " + money(amount) + " has been added to your wallet balance.",
      updatedAt: Date.now()
    });
    toast("Refund processed — " + money(amount) + " added to wallet");
    closeModal();
  } catch(e){ toast(e.message); }
}

    </div>`;
}

async function saveSlider(){
  let d = { image: $("slideImg").value.trim(), link: $("slideLink").value.trim(), createdAt: Date.now() };
  if(!d.image) return toast("Image URL required");
  let r = db.ref("sliders").push();
  d.id = r.key;
  await r.set(d);
  toast("Slider saved");
}

async function deleteSlider(id){
  if(!confirm("Delete slider?")) return;
  await db.ref("sliders/" + id).remove();
  toast("Slider deleted");
}

/* ============================================================
   EXPORT / RESET
============================================================ */
async function exportData(){
  try {
    let out = {};
    for(let k of ["products","orders","users","payments","sliders","settings","support"]){
      out[k] = (await db.ref(k).once("value")).val();
    }
    let blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = "jahidshop-backup-" + Date.now() + ".json";
    a.click();
    URL.revokeObjectURL(url);
    toast("Backup exported");
  } catch(e){ toast(e.message); }
}

async function resetData(){
  if(!confirm("Delete all store data?")) return;
  if(!confirm("This cannot be undone. Continue?")) return;
  try {
    let u = {};
    ["products","orders","users","payments","sliders","settings","support"].forEach(k => u[k] = null);
    await db.ref().update(u);
    toast("Store data reset");
  } catch(e){ toast(e.message); }
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
